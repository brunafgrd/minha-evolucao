<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medidas - Minha Evolução</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    
    <link rel="manifest" href="manifest.json">

</head>

<body>

    <header>

        <h1>Minhas medidas</h1>

        <p>Acompanhe sua evolução corporal</p>

    </header>


    <main>

        <section class="medidas-box">

            <h2>Nova medição</h2>

            <label for="cintura">Cintura (cm)</label>

            <input
                type="number"
                id="cintura"
                step="0.1"
            >


            <label for="abdomen">Abdômen (cm)</label>

            <input
                type="number"
                id="abdomen"
                step="0.1"
            >


            <label for="quadril">Quadril (cm)</label>

            <input
                type="number"
                id="quadril"
                step="0.1"
            >


            <label for="braco">Braço (cm)</label>

            <input
                type="number"
                id="braco"
                step="0.1"
            >


            <label for="coxa">Coxa (cm)</label>

            <input
                type="number"
                id="coxa"
                step="0.1"
            >


            <label for="panturrilha">Panturrilha (cm)</label>

            <input
                type="number"
                id="panturrilha"
                step="0.1"
            >


            <label for="peito">Peito (cm)</label>

            <input
                type="number"
                id="peito"
                step="0.1"
            >


            <button id="btnAdicionarMedidas">
                Salvar medidas
            </button>

        </section>


        <section class="medidas-box historico-medidas">

            <h2>Histórico</h2>

            <div id="listaMedidas"></div>

        </section>
        <section class="medidas-box">

    <h2>Evolução das medidas</h2>

    <label for="medidaGrafico">
        Escolha uma medida
    </label>

    <select id="medidaGrafico">

        <option value="cintura">Cintura</option>

        <option value="abdomen">Abdômen</option>

        <option value="quadril">Quadril</option>

        <option value="braco">Braço</option>

        <option value="coxa">Coxa</option>

        <option value="panturrilha">Panturrilha</option>

        <option value="peito">Peito</option>

    </select>

    <div class="grafico-container">

        <canvas id="graficoMedidas"></canvas>

    </div>

</section>

    </main>

</body>

</html>
